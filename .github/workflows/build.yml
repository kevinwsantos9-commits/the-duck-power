
name: Build Duck Power

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Localizar projeto
        run: |
          BUILD_FILE=$(find . -name build.gradle -o -name build.gradle.kts | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERRO: build.gradle não encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar Duck Power
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Salvar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Duck-Power-1.21.1
          path: '**/build/libs/*.jar'
          if-no-files-found: error
