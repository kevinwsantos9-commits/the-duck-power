
name: Build Duck Power

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Compilar Duck Power
        run: ./gradlew build

      - name: Salvar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: Duck-Power-1.21.1
          path: build/libs/*.jar
